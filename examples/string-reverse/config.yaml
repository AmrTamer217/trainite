model_name: transformer
dataset_name: string-reverse
trainer_name: pretrainer
model:
  vocab_size: 32
  hidden_size: 64
  num_layers: 2
  num_heads: 2
  feedforward_dim: 128
  dropout: 0.1
  max_seq_len: 128
dataset:
  alphabet: abcdefghijklmnopqrstuvwxyz
  vocab_size: 26
  train_size: 256
  val_size: 64
  batch_size: 32
  min_seq_len: 1
  max_seq_len: 16
  fixed_length: true
  num_workers: 2
  seed: 7
trainer:
  device: cpu
  type: pre
  epochs: 3
  learning_rate: 0.001
  log_every_steps: 10
  grad_clip_norm: null
output:
  root: output
  run_name: transformer__string-reverse
seed: 42
